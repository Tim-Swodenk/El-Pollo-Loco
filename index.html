<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>El Pollo Loco</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/img/10_fav_icon/favicon.png"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./models/world.class.js"></script>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/small-chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/backgroud-objects.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/endboss.class.js"></script>

    <script src="models/throwable-object.class.js"></script>
    <script src="models/collectable-objects.class.js"></script>

    <script src="./models/status-bar.class.js"></script>

    <script src="./models/status-bar-health.class.js"></script>
    <script src="./models/status-bar-bottles.class.js"></script>
    <script src="./models/status-bar-coins.class.js"></script>
    <script src="./models/status-bar-endboss.class.js"></script>

    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>

    <script src="./js/game.js" defer></script>
  </head>
  <body>
    <main class="game-wrapper">
      <section
        id="start-screen"
        class="start-screen"
        aria-label="Start El Pollo Loco"
      >
        <div class="start-screen__backdrop" aria-hidden="true"></div>
        <div class="start-screen__content">
          <h1 class="start-screen__title">El Pollo Loco</h1>
          <p class="start-screen__lead">
            Help Pepe push through the desert, collect salsa bottles and defeat
            the crazy boss rooster.
          </p>
          <ul class="start-screen__controls" aria-label="Controls">
            <li>
              <span class="key">←</span>
              <span class="key">→</span>
              <span class="label">Move</span>
            </li>
            <li>
              <span class="key">SPACE</span>
              <span class="label">Jump</span>
            </li>
            <li>
              <span class="key">D</span>
              <span class="label">Throw bottle</span>
            </li>
          </ul>
          <button id="start-button" class="start-screen__button" type="button">
            Start game
          </button>
          <p class="start-screen__hint">Or press Enter/Space</p>
        </div>
      </section>

      <section id="game-container" class="game-container is-hidden">
        <canvas
          id="canvas"
          width="720"
          height="480"
          aria-label="El Pollo Loco playfield"
        ></canvas>
        <div class="game-controls" aria-label="Display options">
          <button
            id="fullscreen-button"
            class="game-controls__button"
            type="button"
            aria-pressed="false"
          >
            Fullscreen
          </button>
          <button
            id="exit-button"
            class="game-controls__button"
            type="button"
          >
            Zurück zum Home Screen
          </button>
        </div>
        <div
          id="game-over-screen"
          class="game-over is-hidden"
          role="dialog"
          aria-modal="true"
          aria-labelledby="game-over-title"
          inert
        >
          <div class="game-over__backdrop" aria-hidden="true"></div>
          <div class="game-over__content">
            <img
              class="game-over__title-image"
              src="./assets/img/You won, you lost/Game Over.png"
              alt="Game Over"
            />
            <p id="game-over-message" class="game-over__message">
              Pepe was defeated. Give it another try!
            </p>
            <button id="restart-button" class="game-over__button" type="button">
              Play again
            </button>
            <p class="game-over__hint">Press Enter or Space</p>
          </div>
        </div>

        <div class="control-hints" aria-hidden="true">
          <div class="control-hints__group">
            <span class="key">←</span>
            <span class="key">→</span>
            <span class="label">Move</span>
          </div>
          <div class="control-hints__group">
            <span class="key">SPACE</span>
            <span class="label">Jump</span>
          </div>
          <div class="control-hints__group">
            <span class="key">D</span>
            <span class="label">Throw</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
